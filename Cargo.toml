[workspace]
resolver = "2"

members = [
    "backstop",
    "pool",
    "mocks/mock-pool",
    "mocks/mock-pool-factory",
    "mocks/moderc3156",
    "pool-factory",
    "test-suites"
]

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level = "z"
overflow-checks = true # DEV: Do not remove this check - doing so will create vulnerabilities
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies.soroban-sdk]
version = "28.0.0"

# script3 helper crates: the crates.io releases top out at soroban-sdk 25, so these are
# pinned to Zenith forks of upstream's `p26` branches with soroban-sdk set to 28.
# Retire the forks once script3 publishes protocol-28 releases.
[workspace.dependencies.soroban-fixed-point-math]
git = "https://github.com/zenith-protocols/soroban-fixed-point-math"
rev = "f54aa2f"

[workspace.dependencies.cast]
version = "0.3.0"
default-features = false

[workspace.dependencies.sep-40-oracle]
git = "https://github.com/zenith-protocols/sep-40-oracle"
rev = "f457856"

[workspace.dependencies.sep-41-token]
git = "https://github.com/zenith-protocols/sep-41-token"
rev = "6a5be76"
